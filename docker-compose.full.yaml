  delivery-analytics-frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_WS_URL: ws://localhost:8005/ws/courier_events
      VITE_TRACKING_PRODUCER_API_URL: http://localhost:8000
#    depends_on:
#      delivery-analytics:
#        condition: service_started
#      samokat:
#        condition: service_started
    ports:
      - "5174:5174"
    volumes:
      - ./_frontend/delivery_analytics:/app

