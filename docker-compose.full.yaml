  delivery-analytics-migrations:
    build:
      context: ./delivery_analytics
    command: ["alembic", "upgrade", "head"]
    environment: &delivery_analytics_env
      DELIVERY_ANALYTICS__POSTGRES__HOST: delivery-analytics-postgres
      DELIVERY_ANALYTICS__POSTGRES__PORT: 5432
      DELIVERY_ANALYTICS__POSTGRES__USER: postgres
      DELIVERY_ANALYTICS__POSTGRES__PASSWORD: postgres
      DELIVERY_ANALYTICS__POSTGRES__DATABASE: postgres
      DELIVERY_ANALYTICS__KAFKA__BOOTSTRAP_SERVERS: kafka:29092
      DELIVERY_ANALYTICS__KAFKA__TRACKING_TOPIC: delivery.tracking
      DELIVERY_ANALYTICS__QUEUES__WS_SEND_TIMEOUT_SEC: 2
    depends_on:
