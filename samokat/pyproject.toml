[project]
name = "samokat"
version = "0.1.0"
description = "Samokat course project"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "clickhouse-connect>=1.3.0",
    "dishka>=1.10.1",
    "fastapi>=0.138.0",
    "faststream[kafka]>=0.7.1",
    "greenlet>=3.5.2",
    "httpx>=0.28.1",
    "numpy>=2.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "uvloop>=0.22.1",
    "viztracer>=1.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samokat"]
