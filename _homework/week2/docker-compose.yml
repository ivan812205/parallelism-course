services:
  db:
    image: postgres:17-alpine
    # Лимит соединений остаётся стандартным: приложения ходят в базу через pgbouncer,
    # который держит десятки реальных соединений вместо сотен клиентских.
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "7432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      # образ по умолчанию слушает 5432, ставим привычный порт пулера
      LISTEN_PORT: "6432"
      # transaction: реальное соединение отдаётся клиенту на одну транзакцию,
      # поэтому сотни клиентских соединений живут на десятках серверных
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      # серверный пул — новый регулятор: 25 реальных соединений держат сотню
      # клиентских. Замер ДЗ 6: подъём до 50 пропускной способности не добавил,
      # потому что упор в CPU самой базы, а не в число соединений
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
      # доступ к служебной базе pgbouncer: SHOW POOLS, SHOW STATS
      ADMIN_USERS: postgres
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  payment-api:
    build: ./mock_apis/payment
    ports:
      - "9001:9001"

  protection-api:
    build: ./mock_apis/protection
    ports:
      - "9002:9002"

  redis:
    image: redis:7-alpine
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -lc
      - |
        KAFKA_TOPICS=/opt/bitnami/kafka/bin/kafka-topics.sh
        for i in {1..30}; do
          $$KAFKA_TOPICS --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        $$KAFKA_TOPICS --bootstrap-server kafka:29092 --create --if-not-exists --topic tickets.purchased --partitions 2 --replication-factor 1

  # app запускаем локально: сначала `uv run alembic upgrade head`
  # потом `uv run uvicorn app.main:app --reload`
  # app:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     payment-api:
  #       condition: service_started
  #     protection-api:
  #       condition: service_started
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
